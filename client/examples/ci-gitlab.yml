# GitLab CI jobs announcing a module release on DoliNews.
#
# Copy them into the .gitlab-ci.yml of the module. The announcement lives in
# the repository as ONE file, docs/dolinews.md, rewritten for every release,
# and is submitted when the version is tagged. No file, nothing submitted: a
# release may go out without an announcement.
#
# The token is created from the contributor account (API tokens), then set in
# Settings > CI/CD > Variables as DOLINEWS_API_TOKEN, masked. If it is also
# protected, the v* tags must be protected too (Settings > Repository >
# Protected tags), or the job runs with an empty variable. A token grants the
# right to submit, never to publish: what the CI sends lands in review.
#
# The client is installed alone with "composer global require": these jobs do
# not need the vendor/ of the module, which can be long to install.

stages:
  - test
  - annonce          # after test: a release that fails is not announced

variables:
  ANNONCE: docs/dolinews.md

.dolinews-client:
  image: composer:2
  cache: []
  dependencies: []
  before_script:
    - composer global require --quiet --no-interaction dolismartmaker/dolinews-client:^1
    - export PATH="$(composer global config bin-dir --absolute --quiet):$PATH"

# Is the announcement file acceptable? No network, no token, so this also runs
# on a merge request coming from a fork.
annonce:verification:
  extends: .dolinews-client
  stage: test
  rules:
    - changes:
        - docs/dolinews.md
  script:
    - publish-article.php "$ANNONCE" --check

# On a version tag: submit the announcement.
annonce:soumission:
  extends: .dolinews-client
  stage: annonce
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      if [ ! -f "$ANNONCE" ]; then
        echo "No $ANNONCE, nothing to announce for this version."
        exit 0
      fi
      # The file is shared by every release, so it is always there: without
      # this check, forgetting to rewrite it would resubmit the previous
      # announcement under the new number. Tag v1.3.0 -> 1.3.0.
      check-annonce-version.sh "$ANNONCE" "${CI_COMMIT_TAG#v}" || exit 1
      if [ -z "$DOLINEWS_API_TOKEN" ]; then
        echo "ERROR: DOLINEWS_API_TOKEN is empty, the announcement was not submitted."
        echo "       Check the CI/CD variable, and that this tag is protected if the variable is."
        exit 1
      fi
      publish-article.php "$ANNONCE"
