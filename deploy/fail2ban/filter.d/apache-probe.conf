# Dotfile probe filter, installed as /etc/fail2ban/filter.d/{{APP_SLUG}}-apache-probe.conf
# by `php artisan install:fail2ban-apache`. The name must stay in step with the
# `filter =` line of jail.d/apache-probe.conf, which the same command renders.
#
# Why a second trap next to the honeypot one: the application only sees what
# reaches it. A request for /.env, /.git/config or /.aws/credentials is refused
# by the web server itself, before PHP, so it leaves NOTHING in honeypot.log and
# the scanner is never banned. Measured on one week of this site: 554 such
# requests from 20 addresses, four of which the application never saw at all.
#
# This filter therefore reads the ACCESS log of the vhost, not the error log,
# and matches on the request path alone -- never on the status code. Two
# reasons. A 403 proves nothing: the same site answered 403 to a hundred
# legitimate image requests the day the storage symlink was stale, and banning
# on the code would have banned its own readers. And a dotfile answered 200
# would be the one case that really matters.

[INCLUDES]

before = common.conf

[Definition]

# A path segment starting with a dot. That is the whole signature: no URL of
# this application has one, and every scanner in the journal asks for at least
# three. Covers the encoded traversals of the same probes (/..%2f.env,
# /%2e%2e/.env), which reach the server with the dot intact.
#
# .well-known is the one legitimate dotted segment on the web: ACME renewal,
# security.txt, traffic-advice. Googlebot asks for it. Banning it would cost a
# certificate renewal, which is the kind of outage nobody connects to fail2ban.
probe = [^" ]*/\.(?!well-known(?:/|\s|"))[^" ]*

failregex = ^<HOST> \S+ \S+ \[[^]]*\] "[A-Z]+ <probe> HTTP/[\d.]+" \d+ \S+ "[^"]*" "[^"]*"$

ignoreregex =

# Written by Apache as $time_local, and matched WITHOUT the brackets and
# WITHOUT a ^ anchor. Both omissions are load-bearing.
#
# The anchor first: a combined line starts with the address, not with the date,
# so ^\[...\] never matches one. fail2ban does not treat that as an error -- it
# falls back to the current time for every line, keeps banning, and only shows
# it as an empty "Date template hits" in fail2ban-regex. The damage comes at
# reload: the tail of the log is read again and a scan from three days ago is
# dated now, so a jail at maxretry = 1 bans a batch of addresses that are no
# longer knocking.
#
# The brackets then: fail2ban removes the text it recognised as the date and
# leaves what surrounds it in place. Keeping them out of the pattern is what
# leaves the empty pair the failregex above expects.
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z

[Init]

maxlines = 1
