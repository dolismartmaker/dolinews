# Scanner trap filter, installed as /etc/fail2ban/filter.d/{{APP_SLUG}}-honeypot.conf
# by `php artisan install:fail2ban`. The name must stay in step with the
# `filter =` lines of jail.d/honeypot.conf, which the same command renders.

[INCLUDES]

before = common.conf

[Definition]

# Levels kept by default: the ones that ban. The "instant" jail passes
# level=instant to keep only the certainties. The third level written by the
# application, "observed", is deliberately held by neither jail.
level = (?:instant|probable)

failregex = ^.*\sHONEYPOT level=<level> ip=<HOST>\s

ignoreregex =

# Two date formats, because the two sources do not share a timestamp and
# neither can take the other's: Monolog writes [2026-09-02 03:57:39], nginx and
# Apache the usual $time_local [02/Sep/2026:03:57:39 +0200].
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
              ^\[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]

[Init]

maxlines = 1
