[INCLUDES]

before = common.conf

[Definition]

# Niveaux retenus par defaut : ceux qui bannissent. La prison "instant" passe
# level=instant pour ne garder que les certitudes.
level = (?:instant|probable)

failregex = ^.*\sHONEYPOT level=<level> ip=<HOST>\s

ignoreregex =

# Deux formats de date, parce que les deux sources n'ont pas le meme horodatage
# et qu'aucune ne peut prendre celui de l'autre : Monolog ecrit
# [2026-09-02 03:57:39], nginx et Apache le $time_local d'usage
# [02/Sep/2026:03:57:39 +0200].
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
              ^\[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]

[Init]

maxlines = 1
