# Dotfile probe jail, installed as /etc/fail2ban/jail.d/{{APP_SLUG}}-apache-probe.conf.
#
# This file is the versioned template: `php artisan install:fail2ban-apache`
# replaces the double-brace placeholders with the values of the current
# deployment and writes the result, along with the matching filter, under
# /etc/fail2ban/. Never hand-edit the generated file, a redeploy would
# overwrite it.
#
# Companion of the {{APP_SLUG}}-honeypot jails, and same restriction: only
# install it when the application is exposed directly. Behind a CDN or a
# reverse proxy the address in the access log is the front end's, and banning
# it locally cuts every visitor at once.
#
# logpath is the access log OF THE VHOST, which is rarely the distribution
# default: a jail pointed at a file that no vhost writes to starts, reports
# itself as active, and bans nobody. Declare it with
# OPS_FAIL2BAN_APACHE_ACCESS_LOG when it differs, the install command refuses
# to write anything if the file does not exist.

[{{APP_SLUG}}-apache-probe]
enabled  = true
filter   = {{APP_SLUG}}-apache-probe
logpath  = {{ACCESS_LOG}}
# One is enough: a request for a path whose segment starts with a dot is never
# a mistyped URL, and the scanners in the journal fire two hundred of them in
# nine seconds. Waiting for a fourth only means being sure later.
maxretry = 1
findtime = 1h
# Same schedule as the honeypot jails, for the same reason: behind a company
# NAT the public address is shared, and one infected workstation would cost a
# legitimate reader the service for a month.
bantime  = 24h
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 30d
banaction = %(banaction_allports)s
protocol  = all
