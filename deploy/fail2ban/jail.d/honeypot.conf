# Scanner trap jails, installed as /etc/fail2ban/jail.d/{{APP_SLUG}}-honeypot.conf.
#
# This file is the versioned template: `php artisan install:fail2ban` replaces
# the double-brace placeholders with the values of the current deployment and
# writes the result, along with the matching filter, under /etc/fail2ban/.
# Never hand-edit the generated file, a redeploy would overwrite it. A logpath
# pointing at a directory that does not exist is not an error fail2ban reports
# loudly: the jail simply never bans anyone.
#
# Only install these when the application is exposed directly. Behind a front
# end (a CDN, a reverse proxy) a local ban drops packets that never come from
# the scanner: report the hits to the front end instead and leave these off.
#
# Under nginx, or with the Apache layer, add a second indented line below
# logpath pointing at the web server journal.

[{{APP_SLUG}}-honeypot]
enabled  = true
filter   = {{APP_SLUG}}-honeypot
logpath  = {{LOG_DIR}}/honeypot.log
maxretry = 4
findtime = 1h
# 24h growing, and not a month outright: behind a company NAT the public
# address is shared by every workstation, and one infected machine would cost a
# legitimate user the service for thirty days.
bantime  = 24h
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 30d
banaction = %(banaction_allports)s
protocol  = all

[{{APP_SLUG}}-honeypot-instant]
enabled  = true
filter   = {{APP_SLUG}}-honeypot[level=instant]
logpath  = {{LOG_DIR}}/honeypot.log
maxretry = 1
findtime = 1h
bantime  = 24h
bantime.increment = true
bantime.factor    = 2
bantime.maxtime   = 30d
banaction = %(banaction_allports)s
protocol  = all
