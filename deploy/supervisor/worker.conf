; Supervisor program running the Laravel queue worker, installed as
; /etc/supervisor/conf.d/{{APP_SLUG}}-worker.conf.
;
; This file is the versioned template: `php artisan install:supervisor`
; replaces the double-brace placeholders with the values of the current
; deployment (application path, PHP binary, owner of the checkout) and writes
; the result to /etc/supervisor/conf.d/. Edit the options here, then re-run the
; command with --force; never hand-edit the generated file, a redeploy would
; overwrite it.
;
; Nothing below is allowed to hold a fixed application path: Supervisor refuses
; to read a program whose stdout_logfile directory does not exist, and it
; refuses the WHOLE file, so a path belonging to another server takes every
; other program declared here down with it (CANT_REREAD).
;
; Without this worker, everything that is queued stays in the jobs table and
; never leaves: the mails, the notifications, the outgoing webhooks. Nothing
; says so on screen, and the application log stays empty, which reads as
; "nothing to report" rather than "nothing left".

[program:{{APP_SLUG}}-worker]
process_name=%(program_name)s_%(process_num)02d
command={{PHP}} {{APP_PATH}}/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory={{APP_PATH}}
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user={{USER}}
; One process is the default of the house. Raise it to 2 when a queued job
; calls a third party we do not control: a single worker stuck on an
; unreachable endpoint holds back every mail queued behind it.
numprocs=1
redirect_stderr=true
stdout_logfile={{LOG_DIR}}/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
; At least as long as --max-time, otherwise Supervisor kills a worker in the
; middle of a job: one mail lost in the middle of a batch.
stopwaitsecs=3600

; NO scheduler program here, deliberately: the Laravel scheduler of this
; application runs from /etc/cron.d/{{APP_SLUG}}, installed by `make cron`
; (deploy/cron/scheduler.cron). Adding a `schedule:work` program alongside it
; would run every scheduled command twice, and a scheduled command that writes
; (quota resets, subscription sync, state reconciliation) turns a double run
; into an incident rather than waste.
;
; To move to Supervisor instead: remove /etc/cron.d/{{APP_SLUG}} FIRST, set
; OPS_SCHEDULER=supervisor so the doctor asks for the program below rather than
; for the cron entry, then add:
;
; [program:{{APP_SLUG}}-scheduler]
; process_name=%(program_name)s
; command={{PHP}} {{APP_PATH}}/artisan schedule:work
; directory={{APP_PATH}}
; autostart=true
; autorestart=true
; user={{USER}}
; numprocs=1
; redirect_stderr=true
; stdout_logfile={{LOG_DIR}}/scheduler.log
; stdout_logfile_maxbytes=10MB
; stdout_logfile_backups=2
